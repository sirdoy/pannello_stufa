name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eslint:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Errors only: warn-level rules (tailwind class order etc.) are skipped by --quiet
      - name: ESLint (errors only)
        run: npm run lint:ci

      # Tests included: jest and the build do not type-check them
      - name: TypeScript
        run: npm run type-check
